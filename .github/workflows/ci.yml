name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fixtures:validate
      - run: npm run analyze:commonmark
      - run: npm run mutants:generate
      - run: git diff --exit-code -- data/mutations data/reports
      - run: npm run build
