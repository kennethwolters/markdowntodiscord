<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown to Discord Converter</title>
    <meta name="description" content="Convert Markdown into Discord-ready messages in your browser. Tables, task lists, links, code blocks, mentions, and 2,000-character splitting are handled locally." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://markdown-to-discord.pages.dev/" />
    <meta property="og:title" content="Markdown to Discord Converter" />
    <meta property="og:description" content="Paste Markdown and copy Discord-ready messages. Conversion stays in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://markdown-to-discord.pages.dev/" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"Markdown to Discord","url":"https://markdown-to-discord.pages.dev/","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":"A local browser-based Markdown to Discord converter."}
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Markdown <span aria-hidden="true">→</span> Discord</a>
      <div class="header-actions">
        <a href="/discord-markdown-guide/">Guide</a>
        <span class="local-badge" title="Conversion happens in this browser"><span aria-hidden="true"></span> Local</span>
      </div>
    </header>

    <main>
      <section class="workspace" aria-label="Markdown to Discord converter">
        <div class="panel input-panel">
          <div class="panel-heading">
            <h1>Markdown</h1>
            <div class="tools">
              <input id="file-input" class="sr-only" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" />
              <button class="icon-button" id="open-file" type="button" aria-label="Open a Markdown file" title="Open .md file">↑</button>
              <button class="icon-button" id="clear" type="button" aria-label="Clear Markdown" title="Clear">×</button>
            </div>
          </div>
          <label class="sr-only" for="source">Markdown</label>
          <textarea id="source" spellcheck="false" placeholder="Paste Markdown…" autofocus></textarea>
          <div class="panel-footer">
            <span><span aria-hidden="true">#</span> <span id="source-count">0</span></span>
            <span class="tab-state" title="Draft saved only in this tab" aria-label="Draft saved only in this tab">◷</span>
          </div>
        </div>

        <div class="flow-arrow" aria-hidden="true">→</div>

        <div class="panel output-panel">
          <div class="panel-heading">
            <h2>Discord</h2>
            <button class="copy-all" id="copy-all" type="button" disabled aria-label="Copy output" title="Copy output">⧉</button>
          </div>
          <div id="conversion-status" class="sr-only" role="status" aria-live="polite"></div>
          <div id="warnings" class="warnings"></div>
          <div id="outputs" class="outputs">
            <div class="empty-state" aria-hidden="true">↓</div>
          </div>
          <div class="panel-footer output-footer">
            <label class="toggle" title="Prevent accidental notifications">
              <span aria-hidden="true">@</span>
              <span class="sr-only">Prevent accidental mentions</span>
              <input id="neutralize" type="checkbox" checked />
            </label>
            <span><span aria-hidden="true">#</span> <span id="message-count">0</span></span>
          </div>
        </div>
      </section>

      <div id="undo-clear" class="undo-toast" role="status" hidden>
        Cleared <button id="undo-clear-button" type="button">Undo</button>
      </div>
    </main>

    <footer>CommonMark · GFM · Discord</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
